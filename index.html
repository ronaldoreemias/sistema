<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procura Vagas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div>
            <img src="img/fome.png" alt="Logo">
        </div>
        <h1>Busque sua vaga aqui</h1>
        <nav>
            <button id="menuButton">Menu</button>
            <div class="dropdown" id="dropdownMenu">
                <button>Seja um membro</button>
                <button>Entre na comunidade</button>
                <button>Cadastre-se</button>
            </div>
        </nav>
    </header>
    <main>
        <div class="repositorios">
            <div class="contender_repositorios">
                <h1>Link de repositório aqui</h1>
                <div class="link_repositorios" style="display: flex;">
                    <input type="text">
                    <button>enviar</button>
                </div>
            </div>
        </div>
        <div class="container_vagas">
            <h1>Vagas para Desenvolvedor</h1>
            <div class="vagas">
                <div>
                    <input type="text" id="vagaInput">
                    <button onclick="adicionarVaga()">Enviar</button>
                </div>
                <div class="containder_vagas" id="vagas">
                </div>
                <div class="barra_pesquisa">
                    <input type="text" id="procurar">
                    <button onclick="procurarVaga()">Pesquisar</button>
                </div>
            </div>
        </div>
    </main>
    <script>
        function adicionarVaga() {
            let vagaInput = document.getElementById("vagaInput").value;
            let vagasDiv = document.getElementById("vagas");
            let agora = new Date();
            let dataHora = agora.toLocaleString();
            let novaVaga = document.createElement("div");
            novaVaga.innerHTML = `${vagaInput} - ${dataHora} - João Pessoa, Paraíba`;
            vagasDiv.appendChild(novaVaga);
            localStorage.setItem("vagas", vagasDiv.innerHTML);
        }

        window.onload = function() {
            let vagas = localStorage.getItem("vagas");
            if (vagas) {
                document.getElementById("vagas").innerHTML = vagas;
            }
            document.getElementById("menuButton").addEventListener("click", toggleMenu);
        }

        function toggleMenu() {
            let dropdownMenu = document.getElementById("dropdownMenu");
            if (dropdownMenu.style.display === "none" || dropdownMenu.style.display === "") {
                dropdownMenu.style.display = "block";
            } else {
                dropdownMenu.style.display = "none";
            }
        }

        function procurarVaga() {
            let input = document.getElementById("procurar").value.toLowerCase();
            let vagas = document.getElementById("vagas").getElementsByTagName("div");

            for (let i = 0; i < vagas.length; i++) {
                let vaga = vagas[i];
                if (vaga.innerHTML.toLowerCase().indexOf(input) > -1) {
                    vaga.style.display = "";
                } else {
                    vaga.style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
